<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Jennifer Rogers Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue: #1e78ff;
  --blue-glow: rgba(30,120,255,0.65);
  --blue-dim: rgba(30,120,255,0.12);
  --green: #00dc8c;
  --green-glow: rgba(0,220,140,0.55);
  --green-dim: rgba(0,220,140,0.08);
  --coral: #d85a30;
  --amber: #f0a020;
  --purple: #7f77dd;
  --purple-glow: rgba(127,119,221,0.5);
  --bg: #03030a;
  --surface: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.06);
  --text-primary: rgba(255,255,255,0.88);
  --text-secondary: rgba(255,255,255,0.45);
  --text-tertiary: rgba(255,255,255,0.18);
}

html, body {
  width: 100%; min-height: 100vh;
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

/* ── PAGE ── */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 56px 24px 80px;
  position: relative;
}

/* ambient noise grain */
.page::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.4;
}

/* ── TITLE ── */
.title-wrap {
  text-align: center;
  margin-bottom: 64px;
  position: relative; z-index: 1;
  cursor: pointer;
}
.title-wrap:hover .title-main { opacity: 1; text-shadow: 0 0 60px rgba(255,255,255,0.12); }
.title-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 10px;
}
.title-main {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 400; letter-spacing: -0.01em;
  color: rgba(255,255,255,0.82);
  opacity: 0.82;
  transition: opacity 0.4s, text-shadow 0.4s;
  line-height: 1.15;
}
.title-main em { font-style: italic; color: rgba(255,255,255,0.55); }
.title-sub {
  margin-top: 10px;
  font-size: 12px; font-weight: 300;
  color: var(--text-tertiary);
  letter-spacing: 0.06em;
}

/* ── FLOODS ── */
.flood {
  position: fixed; left: 0; right: 0;
  pointer-events: none; opacity: 0;
  transition: opacity 1s cubic-bezier(0.4,0,0.2,1);
  z-index: 0;
}
.flood-trust { top:0; height:50%; background:radial-gradient(ellipse 80% 110% at 50% 0%,rgba(30,120,255,0.68) 0%,rgba(10,55,180,0.34) 40%,transparent 100%); }
.flood-adj   { bottom:0; height:50%; background:radial-gradient(ellipse 80% 110% at 50% 100%,rgba(0,220,140,0.6) 0%,rgba(0,110,70,0.28) 40%,transparent 100%); }

body.hover-trust .flood-trust { opacity: 1; }
body.hover-adj   .flood-adj   { opacity: 1; }
body.hover-infra .flood-trust, body.hover-infra .flood-adj { opacity: 0.42; }

/* ── CANVAS ── */
.canvas {
  position: relative; z-index: 1;
  width: 280px;
  display: flex; flex-direction: column; align-items: center;
}

/* ── TYPE ATOMS ── */
.num {
  font-size: 8px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 4px;
}
.lbl {
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.04em; color: var(--text-secondary);
  transition: color 0.3s;
}

/* ── 1. TRUST HOLDER ── */
.trust {
  width: 126px; height: 126px; border-radius: 50%;
  border: 1px solid rgba(30,120,255,0.28);
  background: rgba(30,120,255,0.05);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; cursor: pointer;
  position: relative; flex-shrink: 0;
  transition: all 0.6s cubic-bezier(0.34,1.4,0.64,1);
}
.trust::after {
  content: ''; position: absolute; inset: -12px; border-radius: 50%;
  border: 1px solid rgba(30,120,255,0.06);
  transition: all 0.6s cubic-bezier(0.34,1.4,0.64,1);
}
body.hover-trust .trust {
  transform: scale(1.13);
  border-color: rgba(30,120,255,1);
  background: rgba(30,120,255,0.16);
  box-shadow: 0 0 0 1px rgba(30,120,255,0.14), 0 0 60px var(--blue-glow), 0 0 120px rgba(30,120,255,0.22);
}
body.hover-trust .trust::after { inset: -22px; border-color: rgba(30,120,255,0.16); }
body.hover-trust .trust .lbl { color: #60aaff; }

/* ── PIPES ── */
.pipe { width: 2px; position: relative; flex-shrink: 0; overflow: hidden; }
.pipe-blue-top { height: 28px; background: linear-gradient(to bottom, rgba(30,120,255,0.38), rgba(30,120,255,0.18)); }
.pipe-blue-bot { height: 18px; background: linear-gradient(to bottom, rgba(30,120,255,0.18), rgba(30,120,255,0.06)); }
.pipe-fill {
  position: absolute; top: 0; left: 0; width: 100%; height: 0%;
  background: rgba(30,120,255,0.95); transition: height 0s;
}
body.gate-open .pipe-blue-top .pipe-fill { height: 100%; transition: height 0.28s cubic-bezier(0.4,0,0.6,1) 0.16s; }
body.gate-open .pipe-blue-bot .pipe-fill { height: 100%; transition: height 0.28s cubic-bezier(0.4,0,0.6,1) 0.36s; }

.arr-dn {
  width: 0; height: 0; flex-shrink: 0;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 6px solid rgba(30,120,255,0.22);
  transition: border-top-color 0.3s 0.52s;
}
body.gate-open .arr-dn { border-top-color: rgba(30,120,255,0.95); }

/* ── 3. LEVER GATE ── */
.gate-row {
  width: 100%; height: 36px;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0; cursor: pointer;
}
.gate-lbl-pos { position: absolute; right: calc(50% + 20px); text-align: right; }

.slide-gate { position: relative; width: 60px; height: 4px; display: flex; align-items: center; }
.gate-track { position: absolute; left: 0; width: 100%; height: 1px; background: rgba(30,120,255,0.14); }
.gate-pivot-dot {
  position: absolute; left: -1px; top: 50%;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--coral); box-shadow: 0 0 14px rgba(216,90,48,0.8);
  transform: translateY(-50%); z-index: 3;
  transition: background 0.3s, box-shadow 0.3s;
}
.gate-bar {
  width: 100%; height: 2.5px; border-radius: 2px;
  background: linear-gradient(to right, var(--coral), rgba(216,90,48,0.25));
  box-shadow: 0 0 10px rgba(216,90,48,0.45);
  position: relative; z-index: 2;
  transform-origin: left center; transform: rotate(0deg);
  transition: transform 0.5s cubic-bezier(0.34,1.1,0.64,1), box-shadow 0.3s;
}
body.gate-open .gate-bar { transform: rotate(-70deg); box-shadow: 0 0 28px rgba(216,90,48,1); }
body.gate-open .gate-pivot-dot { background: #ff6030; box-shadow: 0 0 28px rgba(255,96,48,1); }
body.gate-open .gate-row .lbl { color: #ff7850; }
body.hover-lever .gate-row .lbl { color: rgba(255,120,80,0.65); }

/* ── HOLE ── */
.hole-zone { width: 116px; height: 6px; position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.hole-slot {
  width: 22px; height: 5px; border-radius: 2px;
  background: rgba(30,120,255,0); border: 1px solid rgba(30,120,255,0);
  transition: background 0.28s 0.44s, border-color 0.28s 0.44s, box-shadow 0.28s 0.44s;
  position: relative;
}
body.gate-open .hole-slot {
  background: rgba(30,120,255,0.55); border-color: rgba(30,120,255,0.9);
  box-shadow: 0 0 14px rgba(30,120,255,0.8);
}
.hole-drip {
  position: absolute; top: 5px; left: 50%;
  width: 2px; height: 0;
  background: linear-gradient(to bottom, rgba(30,120,255,1), rgba(30,120,255,0.15));
  transform: translateX(-50%); transition: height 0s; border-radius: 1px;
}
body.gate-open .hole-drip { height: 46px; transition: height 0.38s cubic-bezier(0.4,0,0.2,1) 0.5s; }

/* ── 4. INFRASTRUCTURE ── */
.infra {
  width: 116px; height: 58px; border-radius: 8px;
  border: 1.5px solid rgba(127,119,221,0.38);
  background: rgba(127,119,221,0.055);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; position: relative; flex-shrink: 0;
  transition: all 0.5s cubic-bezier(0.34,1.2,0.64,1);
  overflow: hidden;
}
.infra-blue {
  position: absolute; top: 0; left: 0; right: 0; height: 0%;
  background: linear-gradient(to bottom, rgba(30,120,255,0.58), rgba(30,120,255,0.16));
  transition: height 0s; z-index: 0;
}
.infra-green {
  position: absolute; bottom: 0; left: 0; right: 0; height: 0%;
  background: linear-gradient(to top, rgba(0,220,140,0.58), rgba(0,220,140,0.14));
  transition: height 0s; z-index: 0;
}
body.gate-open .infra-blue { height: 40%; transition: height 0.4s cubic-bezier(0.4,0,0.2,1) 0.6s; }
body.hover-infra .infra {
  transform: scale(1.52);
  border-color: rgba(180,170,255,1);
  box-shadow: 0 0 0 1px rgba(127,119,221,0.22), 0 0 60px var(--purple-glow), 0 0 120px rgba(127,119,221,0.2);
  z-index: 20;
}
body.hover-infra .infra-blue { height: 50%; background: linear-gradient(to bottom, rgba(30,120,255,0.72), rgba(30,120,255,0.28)); transition: height 0.35s cubic-bezier(0.34,1.2,0.64,1); }
body.hover-infra .infra-green { height: 50%; background: linear-gradient(to top, rgba(0,220,140,0.72), rgba(0,220,140,0.28)); transition: height 0.35s cubic-bezier(0.34,1.2,0.64,1) 0.05s; }
body.hover-infra .infra .lbl { color: #ccc8ff; }
.infra > * { position: relative; z-index: 1; }

.op-brkt { position: absolute; right: -50px; top: 0; bottom: 0; pointer-events: none; }
.op-brkt-line { position: absolute; right: 0; top: 0; bottom: 0; width: 1px; background: rgba(127,119,221,0.2); }
.op-brkt-line::before, .op-brkt-line::after { content: ''; position: absolute; right: 0; width: 6px; height: 1px; background: rgba(127,119,221,0.2); }
.op-brkt-line::before { top: 0; } .op-brkt-line::after { bottom: 0; }
.op-brkt-lbl { position: absolute; right: -40px; top: 50%; transform: translateY(-50%); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(127,119,221,0.32); white-space: nowrap; }

/* ── 5. EXTRACTION GATE ── */
.extract-row {
  width: 100%; height: 36px;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0; cursor: pointer;
}
.extract-lbl-pos { position: absolute; left: calc(50% + 20px); }

.extract-gate { position: relative; width: 60px; height: 4px; display: flex; align-items: center; }
.extract-track { position: absolute; left: 0; width: 100%; height: 1px; background: rgba(0,220,140,0.12); }
.extract-pivot-dot {
  position: absolute; left: -1px; top: 50%;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--amber); box-shadow: 0 0 14px rgba(240,160,32,0.7);
  transform: translateY(-50%); z-index: 3;
  transition: background 0.3s, box-shadow 0.3s;
}
.extract-bar {
  width: 100%; height: 2.5px; border-radius: 2px;
  background: linear-gradient(to right, rgba(240,160,32,0.25), var(--amber));
  box-shadow: 0 0 10px rgba(240,160,32,0.4);
  position: relative; z-index: 2;
  transform-origin: left center; transform: rotate(0deg);
  transition: transform 0.5s cubic-bezier(0.34,1.1,0.64,1), box-shadow 0.3s;
}
body.hover-extract .extract-bar { box-shadow: 0 0 28px rgba(240,160,32,1); }
body.hover-extract .extract-pivot-dot { background: #ffc040; box-shadow: 0 0 28px rgba(255,192,64,1); }
body.hover-extract .extract-row .lbl { color: #ffc040; }
body.hover-extract .infra-green { height: 50%; background: linear-gradient(to top, rgba(0,220,140,0.65), rgba(0,220,140,0.2)); transition: height 0.4s cubic-bezier(0.34,1.2,0.64,1); }

.money-floats { position: absolute; left: 50%; bottom: 0; width: 60px; height: 80px; transform: translateX(-50%); pointer-events: none; overflow: hidden; }
.mf { position: absolute; font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif; color: rgba(255,192,64,0.92); text-shadow: 0 0 10px rgba(255,192,64,0.8); opacity: 0; }
body.hover-extract .mf1 { animation: mfloat 1.1s ease-out infinite; }
body.hover-extract .mf2 { animation: mfloat 1.1s ease-out 0.37s infinite; }
body.hover-extract .mf3 { animation: mfloat 1.1s ease-out 0.74s infinite; }
@keyframes mfloat { 0%{opacity:0;bottom:0;} 10%{opacity:1;} 85%{opacity:0.8;} 100%{opacity:0;bottom:72px;} }
.mf1{left:14px;} .mf2{left:28px;} .mf3{left:20px;}

/* ── TEAL PIPES ── */
.pipe-teal-top { height: 26px; background: linear-gradient(to bottom, rgba(0,220,140,0.06), rgba(0,220,140,0.24)); }
.pipe-teal-bot { height: 26px; background: linear-gradient(to bottom, rgba(0,220,140,0.24), rgba(0,220,140,0.52)); }
.arr-up {
  width: 0; height: 0; flex-shrink: 0;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-bottom: 6px solid rgba(0,220,140,0.36);
  transition: border-bottom-color 0.4s;
}
body.hover-adj .arr-up { border-bottom-color: rgba(0,220,140,0.9); }

/* ── 2. ADJ ── */
.adj {
  width: 126px; height: 126px; border-radius: 50%;
  border: 1px solid rgba(0,220,140,0.26);
  background: rgba(0,220,140,0.04);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; cursor: pointer;
  position: relative; flex-shrink: 0;
  transition: all 0.6s cubic-bezier(0.34,1.4,0.64,1); overflow: visible;
}
.adj-inner { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
.adj-fill { position: absolute; bottom: 0; left: 0; right: 0; height: 0%; background: linear-gradient(to top, rgba(0,220,140,0.72), rgba(0,220,140,0.18)); transition: height 0.55s cubic-bezier(0.34,1.4,0.64,1); }
body.hover-adj .adj-fill { height: 100%; }
body.hover-adj .adj { border-color: rgba(0,220,140,1); box-shadow: 0 0 60px var(--green-glow), 0 0 120px rgba(0,220,140,0.22); }
body.hover-adj .adj .lbl { color: #40ffb0; }

.ghost { position: absolute; border-radius: 50%; border: 1px solid rgba(0,220,140,0.11); overflow: hidden; opacity: 0; transition: opacity 0.45s, transform 0.55s cubic-bezier(0.34,1.4,0.64,1); }
.ghost-fill { position: absolute; bottom: 0; left: 0; right: 0; height: 0%; background: linear-gradient(to top, rgba(0,220,140,0.5), rgba(0,220,140,0.08)); transition: height 0.55s cubic-bezier(0.34,1.4,0.64,1) 0.05s; }
.g1{width:100px;height:100px;top:13px;left:-104px;}
.g2{width:88px;height:88px;top:19px;left:-200px;transition-delay:0.07s;}
.g3{width:100px;height:100px;top:13px;right:-104px;}
.g4{width:88px;height:88px;top:19px;right:-200px;transition-delay:0.07s;}
body.hover-adj .ghost{opacity:1;}
body.hover-adj .g1{transform:translateX(-5px);}
body.hover-adj .g2{transform:translateX(-9px);}
body.hover-adj .g3{transform:translateX(5px);}
body.hover-adj .g4{transform:translateX(9px);}
body.hover-adj .ghost-fill{height:100%;}
.adj-text{position:relative;z-index:2;}

/* ── MODAL OVERLAY ── */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(3,3,10,0.82);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s cubic-bezier(0.4,0,0.2,1);
  padding: 24px;
}
.overlay.active { opacity: 1; pointer-events: all; }

.modal {
  width: 100%; max-width: 480px;
  background: rgba(10,10,20,0.95);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 40px;
  position: relative;
  transform: translateY(16px) scale(0.97);
  transition: transform 0.4s cubic-bezier(0.34,1.2,0.64,1);
  box-shadow: 0 40px 120px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
}
.overlay.active .modal { transform: translateY(0) scale(1); }

/* colored top border line matching element color */
.modal::before {
  content: '';
  position: absolute; top: 0; left: 40px; right: 40px; height: 1px;
  background: var(--modal-accent, rgba(255,255,255,0.15));
  border-radius: 0 0 2px 2px;
}

.modal-close {
  position: absolute; top: 18px; right: 20px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.4); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }

.modal-eyebrow {
  font-size: 9px; font-weight: 600; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--modal-color, var(--text-tertiary));
  margin-bottom: 10px;
}
.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px; font-weight: 400; letter-spacing: -0.01em;
  color: var(--text-primary); margin-bottom: 18px; line-height: 1.2;
}
.modal-body {
  font-size: 14px; line-height: 1.75; font-weight: 300;
  color: rgba(255,255,255,0.58); margin-bottom: 28px;
}

.levers-label {
  font-size: 9px; font-weight: 600; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px;
}
.levers-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.lever-pill {
  padding: 5px 12px; border-radius: 100px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
  font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.45);
  letter-spacing: 0.02em;
}
.lever-pill.active {
  background: color-mix(in srgb, var(--modal-color, white) 10%, transparent);
  border-color: color-mix(in srgb, var(--modal-color, white) 35%, transparent);
  color: var(--modal-color, rgba(255,255,255,0.7));
}

/* ── PAGE LOAD ANIMATION ── */
.canvas > * { opacity: 0; transform: translateY(8px); animation: fadeup 0.5s forwards; }
.trust { animation-delay: 0.1s; }
.pipe-blue-top { animation-delay: 0.18s; }
.arr-dn { animation-delay: 0.22s; }
.gate-row { animation-delay: 0.26s; }
.pipe-blue-bot { animation-delay: 0.3s; }
.hole-zone { animation-delay: 0.34s; }
.infra { animation-delay: 0.38s; }
.extract-row { animation-delay: 0.44s; }
.pipe-teal-top { animation-delay: 0.5s; }
.pipe-teal-bot { animation-delay: 0.54s; }
.arr-up { animation-delay: 0.58s; }
.adj { animation-delay: 0.64s; }
@keyframes fadeup { to { opacity: 1; transform: translateY(0); } }

.title-wrap { opacity: 0; animation: fadeup 0.6s 0.05s forwards; }
</style>
</head>
<body>

<div class="flood flood-trust"></div>
<div class="flood flood-adj"></div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeOverlay()">✕</button>
    <div class="modal-eyebrow" id="modal-eyebrow"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="levers-label" id="levers-label"></div>
    <div class="levers-grid" id="levers-grid"></div>
  </div>
</div>

<div class="page">

  <!-- TITLE -->
  <div class="title-wrap" onclick="openModal('title')">
    <div class="title-eyebrow">A framework for trust arbitrage</div>
    <div class="title-main">The Jennifer Rogers <em>Method</em></div>
    <div class="title-sub">Click to read the origin story</div>
  </div>

  <!-- DIAGRAM -->
  <div class="canvas">

    <!-- 1. TRUST HOLDER -->
    <div class="trust"
      onmouseenter="document.body.classList.add('hover-trust')"
      onmouseleave="document.body.classList.remove('hover-trust')"
      onclick="openModal('trust')">
      <div class="num">01</div>
      <div class="lbl">Trust holder</div>
    </div>

    <div class="pipe pipe-blue-top"><div class="pipe-fill"></div></div>
    <div class="arr-dn"></div>

    <!-- 3. LEVER GATE -->
    <div class="gate-row"
      onmouseenter="document.body.classList.add('hover-lever'); this._t=setTimeout(()=>document.body.classList.add('gate-open'),160)"
      onmouseleave="document.body.classList.remove('hover-lever'); clearTimeout(this._t); document.body.classList.remove('gate-open')"
      onclick="openModal('lever')">
      <div class="gate-lbl-pos">
        <div class="lbl" style="text-align:right">03 · Lever gate</div>
      </div>
      <div class="slide-gate">
        <div class="gate-track"></div>
        <div class="gate-pivot-dot"></div>
        <div class="gate-bar"></div>
      </div>
    </div>

    <div class="pipe pipe-blue-bot"><div class="pipe-fill"></div></div>

    <div class="hole-zone">
      <div class="hole-slot"><div class="hole-drip"></div></div>
    </div>

    <!-- 4. INFRASTRUCTURE -->
    <div class="infra"
      onmouseenter="document.body.classList.add('hover-infra')"
      onmouseleave="document.body.classList.remove('hover-infra')"
      onclick="openModal('infra')">
      <div class="infra-blue"></div>
      <div class="infra-green"></div>
      <div class="num">04</div>
      <div class="lbl">Infrastructure</div>
      <div class="op-brkt">
        <div class="op-brkt-line"></div>
        <span class="op-brkt-lbl">operator</span>
      </div>
    </div>

    <!-- 5. EXTRACTION GATE -->
    <div class="extract-row"
      onmouseenter="document.body.classList.add('hover-extract')"
      onmouseleave="document.body.classList.remove('hover-extract')"
      onclick="openModal('extract')">
      <div class="extract-gate">
        <div class="extract-track"></div>
        <div class="extract-pivot-dot"></div>
        <div class="extract-bar"></div>
      </div>
      <div class="extract-lbl-pos">
        <div class="lbl">05 · Extraction gate</div>
      </div>
      <div class="money-floats">
        <div class="mf mf1">$</div>
        <div class="mf mf2">$</div>
        <div class="mf mf3">$</div>
      </div>
    </div>

    <div class="pipe pipe-teal-top"></div>
    <div class="pipe pipe-teal-bot"></div>
    <div class="arr-up"></div>

    <!-- 2. ADJ -->
    <div class="adj"
      onmouseenter="document.body.classList.add('hover-adj')"
      onmouseleave="document.body.classList.remove('hover-adj')"
      onclick="openModal('adj')">
      <div class="adj-inner"><div class="adj-fill"></div></div>
      <div class="ghost g1"><div class="ghost-fill"></div></div>
      <div class="ghost g2"><div class="ghost-fill"></div></div>
      <div class="ghost g3"><div class="ghost-fill"></div></div>
      <div class="ghost g4"><div class="ghost-fill"></div></div>
      <div class="adj-text">
        <div class="num">02</div>
        <div class="lbl">Monetizable adj.</div>
      </div>
    </div>

  </div>
</div>

<script>
const ALL_LEVERS = [
  'Asymmetry','Distribution cost','Monetization density',
  'Acquisition repeatability','Removal friction','Extraction clarity'
];

const CONTENT = {
  title: {
    color: 'rgba(255,255,255,0.6)',
    eyebrow: 'Origin',
    title: 'The Jennifer Rogers Method',
    body: `Jennifer Rogers built her first company out of three things she already had: a background in cold-call phone sales, knowledge of print advertising, and a passion for women in prison. She merged them.\n\nThe model was a 6×9 direct-mail postcard sent via USPS Every Door Direct Mail to residential neighborhoods. The front of the card belonged entirely to a local real estate agent — their photo, branding, contact information. The card was free to the agent. On the back: 15 paid advertising slots sold to contractors, landscapers, and local service providers who wanted to be seen as the agent's preferred referral partners.\n\nThe agent received a free branding vehicle. The contractors received proximate association with a trusted local authority and access to a recurring homeowner audience. The operator collected $595 per slot, per year, across 15 slots, per agent, across every territory.\n\nThe realtor's credibility was the asset. The postcard was the container. The contractors were the customers. The operator owned the container and charged for passage through it.`,
    levers: [],
    leversLabel: ''
  },
  trust: {
    color: '#1e78ff',
    eyebrow: 'Component 01',
    title: 'Trust holder',
    body: `An entity already in possession of concentrated credibility, audience, authority, or relationship capital. It exists prior to the operator's involvement and requires no construction — only location.`,
    levers: ['Asymmetry','Removal friction'],
    leversLabel: 'Related design levers'
  },
  adj: {
    color: '#00dc8c',
    eyebrow: 'Component 02',
    title: 'Monetizable adjacency',
    body: `A party with unmet demand for access to the trust holder's audience and no efficient path to satisfy it. This is the real customer. The operator does not create this demand — they find it already present and unserved.`,
    levers: ['Monetization density','Distribution cost','Acquisition repeatability'],
    leversLabel: 'Related design levers'
  },
  lever: {
    color: '#d85a30',
    eyebrow: 'Component 03',
    title: 'Lever gate',
    body: `The offer extended to the trust holder to obtain access. It is expended once. Its sole purpose is to open the channel through which all subsequent value moves.`,
    levers: ['Asymmetry','Acquisition repeatability'],
    leversLabel: 'Related design levers'
  },
  infra: {
    color: '#7f77dd',
    eyebrow: 'Component 04',
    title: 'Infrastructure',
    body: `The structure that packages and transfers the trust and in which the operator's position becomes load-bearing.`,
    levers: ['Removal friction','Extraction clarity','Monetization density'],
    leversLabel: 'Related design levers'
  },
  extract: {
    color: '#f0a020',
    eyebrow: 'Component 05',
    title: 'Extraction gate',
    body: `The point at which value transfers to the operator.`,
    levers: ['Extraction clarity','Monetization density','Removal friction'],
    leversLabel: 'Related design levers'
  }
};

function openModal(key) {
  const d = CONTENT[key];
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');

  modal.style.setProperty('--modal-accent', d.color);
  modal.style.setProperty('--modal-color', d.color);
  document.getElementById('modal-eyebrow').textContent = d.eyebrow;
  document.getElementById('modal-title').textContent = d.title;

  // format body with paragraph breaks
  document.getElementById('modal-body').innerHTML =
    d.body.split('\n\n').map(p => `<p style="margin-bottom:14px">${p}</p>`).join('');

  const leversLabel = document.getElementById('levers-label');
  const leversGrid = document.getElementById('levers-grid');

  if (d.levers && d.levers.length) {
    leversLabel.textContent = d.leversLabel;
    leversLabel.style.display = 'block';
    leversGrid.style.display = 'flex';
    leversGrid.innerHTML = ALL_LEVERS.map(l =>
      `<span class="lever-pill${d.levers.includes(l) ? ' active' : ''}">${l}</span>`
    ).join('');
  } else {
    leversLabel.style.display = 'none';
    leversGrid.style.display = 'none';
  }

  overlay.classList.add('active');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('active');
}
function closeModal(e) {
  if (e.target === document.getElementById('overlay')) closeOverlay();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
</script>
</body>
</html>
